name: Notifiche

# Ogni 5 minuti controlla le novità su Firebase e invia le notifiche push
# (GitHub può ritardare le esecuzioni programmate di qualche minuto).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # pulsante "Run workflow" nella scheda Actions, per una prova manuale

permissions:
  contents: write # solo per il rinnovo mensile (vedi l'ultimo passaggio)

concurrency:
  group: notifiche
  cancel-in-progress: false

jobs:
  invia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notifier/package-lock.json

      - name: Installa le librerie
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: notifier

      - name: Invia le notifiche
        run: node notify.mjs
        working-directory: notifier
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

      # GitHub sospende le esecuzioni programmate dei repository pubblici senza modifiche
      # da 60 giorni. Se l'ultima modifica ha più di 45 giorni, aggiorna un file di servizio
      # (.github/keepalive) così il conteggio riparte e le notifiche non si fermano.
      - name: Rinnovo automatico
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Rinnovo automatico delle notifiche"
            git push
          fi
