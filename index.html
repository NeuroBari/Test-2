<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferie e Congressi · Neurologia</title>
  <meta name="description" content="Organizzazione mese per mese di ferie e congressi degli specializzandi in Neurologia.">
  <meta name="theme-color" content="#0b5394">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="img/logo.svg" alt="" width="48" height="48">
      <div>
        <h1>Ferie &amp; Congressi</h1>
        <p>Scuola di Specializzazione in Neurologia · Università degli Studi di Bari Aldo Moro</p>
      </div>
    </div>
    <div class="topbar-right">
      <a class="place" href="https://www.google.com/maps/search/?api=1&amp;query=Policlinico+di+Bari" target="_blank" rel="noopener" title="Apri in Google Maps">
        <span class="pin" aria-hidden="true">📍</span>
        <span><strong>Policlinico di Bari</strong><small>Piazza Giulio Cesare 11</small></span>
      </a>
      <span id="mode-badge" class="mode-badge"></span>
    </div>
  </header>

  <main class="container">
    <section class="toolbar card">
      <label class="field">
        <span>Anno di corso</span>
        <select id="year-select"></select>
      </label>
      <div class="month-nav">
        <button type="button" id="prev-month" class="btn icon" aria-label="Mese precedente">‹</button>
        <strong id="month-label"></strong>
        <button type="button" id="next-month" class="btn icon" aria-label="Mese successivo">›</button>
        <button type="button" id="today-btn" class="btn ghost small">Oggi</button>
      </div>
      <nav class="tabs" role="tablist" aria-label="Vista">
        <button type="button" role="tab" data-view="resident">Specializzando</button>
        <button type="button" role="tab" data-view="rep">Rappresentante</button>
      </nav>
    </section>

    <p id="loading" class="muted center">Caricamento…</p>
    <div id="view-resident"></div>
    <div id="view-rep" hidden></div>
  </main>

  <dialog id="day-sheet" class="day-sheet" aria-label="Dettagli del giorno"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
